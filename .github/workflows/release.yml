name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ./NetTracker/NetTracker.csproj

    - name: Build and Publish
      # Собираем как Self-Contained, но без SingleFile для стабильности TraceEvent
      run: |
        dotnet publish ./NetTracker/NetTracker.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Zip Release
      # Упаковываем всю папку в ZIP, чтобы DLL были рядом с EXE
      shell: pwsh
      run: Compress-Archive -Path ./publish/* -DestinationPath ./NetTracker_win-x64.zip

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: NetTracker_win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
