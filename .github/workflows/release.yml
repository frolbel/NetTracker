name: Build and Release

on:
  push:
    tags:
      - 'v*' # Срабатывает при создании тега, например v1.0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      # Указываем путь к файлу проекта в подпапке
      run: dotnet restore ./NetTracker/NetTracker.csproj

    - name: Build and Publish
      # Указываем путь к проекту и параметры сборки в один файл
      run: |
        dotnet publish ./NetTracker/NetTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./publish

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/NetTracker.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
