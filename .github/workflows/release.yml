name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ./NetTracker/NetTracker.csproj

    - name: Build and Publish
      # Используем PublishSingleFile, но включаем флаг IncludeNativeLibrariesForSelfExtract
      # Это заставит .NET упаковать KernelTraceControl.dll внутрь EXE
      run: |
        dotnet publish ./NetTracker/NetTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o ./publish

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/NetTracker.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
